name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=agentic_rag --cov-report=term-missing

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentic-rag:ci .
      - name: Start container
        run: |
          docker run -d --name agentic-rag-ci -p 8000:8000 \
            -e API_KEYS=test-key -e ENVIRONMENT=ci agentic-rag:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs agentic-rag-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f agentic-rag-ci || true
